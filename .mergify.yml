queue_rules:
  - name: master
    batch_size: 5
    merge_method: fast-forward
    queue_conditions:
      - base=master
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    merge_conditions:
      - check-success=CI-Done
      - or:
          - and:
              - author~=^(mergify|kaiyou|muhlemmer|mildred|HorayNarea|hoellen|ofthesun9|Nebukadneza|micw|lub|Diman0|ghostwheel42|nextgens)$
              - -label=review/need2
              - "#approved-reviews-by>=1"
          - "#approved-reviews-by>=2"

  - name: '2024.06'
    batch_size: 5
    merge_method: fast-forward
    queue_conditions:
      - base=2024.06
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    merge_conditions:
      - check-success=CI-Done
      - or:
          - and:
              - author~=^(mergify|kaiyou|muhlemmer|mildred|HorayNarea|hoellen|ofthesun9|Nebukadneza|micw|lub|Diman0|ghostwheel42|nextgens)$
              - -label=review/need2
              - "#approved-reviews-by>=1"
          - "#approved-reviews-by>=2"

  # Allows an administrator to bypass the review count while keeping CI required.
  - name: admin-override
    batch_size: 1
    merge_method: fast-forward
    queue_conditions:
      - base=master
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    merge_conditions:
      - check-success=CI-Done

  - name: admin-override-2024.06
    batch_size: 1
    merge_method: fast-forward
    queue_conditions:
      - base=2024.06
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    merge_conditions:
      - check-success=CI-Done

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= admin

pull_request_rules:
  - name: Queue master PRs for integration testing
    conditions:
      - base=master
      - label=known-contributor
      - -draft
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    actions:
      queue:
        name: master

  - name: Queue master PRs requested by reviewers
    conditions:
      - base=master
      - label=queue-for-ci
      - -draft
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    actions:
      queue:
        name: master

  - name: Queue 2024.06 PRs for integration testing
    conditions:
      - base=2024.06
      - label=known-contributor
      - -draft
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    actions:
      queue:
        name: '2024.06'

  - name: Queue 2024.06 PRs requested by reviewers
    conditions:
      - base=2024.06
      - label=queue-for-ci
      - -draft
      - -title~=(WIP|wip)
      - -label~=^(status/wip|status/blocked)$
    actions:
      queue:
        name: '2024.06'

  - name: Backport to 2024.06 branch
    conditions:
      - base=master
      - label=type/backport
    actions:
      backport:
        branches:
          - '2024.06'

  - name: remove outdated reviews
    conditions:
      - base~=^(master|2024.06)$
    actions:
      dismiss_reviews:
        approved: True
