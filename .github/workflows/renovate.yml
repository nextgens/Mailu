name: renovate

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Renovate token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Add a RENOVATE_TOKEN repository secret with repo and workflow scopes."
            exit 1
          fi

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
        run: |
          set -euo pipefail
          docker run --rm \
            -e RENOVATE_TOKEN \
            -e RENOVATE_REPOSITORIES \
            -e LOG_LEVEL \
            ghcr.io/renovatebot/renovate:44.264.1
