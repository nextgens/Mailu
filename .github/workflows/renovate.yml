name: renovate

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Renovate token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Add a RENOVATE_TOKEN repository secret with repo and workflow scopes."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.263.6
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
