name: mergify-queue
on:
  push:
    branches:
      - 'mergify/merge-queue/**'

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  derive-variables:
    runs-on: ubuntu-latest
    outputs:
      docker_org: ${{ steps.owner.outputs.lowercase }}
      pull_request_number: ${{ steps.pull-request.outputs.number }}
      base_branch: ${{ steps.pull-request.outputs.base_branch }}
    steps:
      - name: Convert repository owner to lowercase
        id: owner
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ github.repository_owner }}

      - name: Find the queue pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          QUEUE_BRANCH: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pull_request=$(gh api --method GET "repos/$REPOSITORY/pulls" \
            -f state=open \
            -f head="$REPOSITORY_OWNER:$QUEUE_BRANCH" \
            --jq '.[0] | [.number, .base.ref] | @tsv')
          IFS=$'\t' read -r number base_branch <<< "$pull_request"
          test -n "$number" && test -n "$base_branch"
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"
          printf 'base_branch=%s\n' "$base_branch" >> "$GITHUB_OUTPUT"

  build-test-deploy:
    needs:
      - derive-variables
    uses: ./.github/workflows/build_test_deploy.yml
    with:
      architecture: 'linux/amd64,linux/arm64/v8,linux/arm/v7'
      mailu_version: pr-${{ needs.derive-variables.outputs.pull_request_number }}
      pinned_mailu_version: ${{ github.sha }}
      docker_org: ghcr.io/${{ needs.derive-variables.outputs.docker_org }}
      branch: ${{ needs.derive-variables.outputs.base_branch }}
      deploy: 'false'
      release: 'false'
    secrets: inherit

  ci-success:
    name: CI-Done
    if: always()
    needs:
      - derive-variables
      - build-test-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the build and tests succeeded
        env:
          BUILD_RESULT: ${{ needs.build-test-deploy.result }}
        run: test "$BUILD_RESULT" = success
