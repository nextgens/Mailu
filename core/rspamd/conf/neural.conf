servers = "{{ REDIS_ADDRESS }}";
enabled = true;

rules {
    # Keep a new profile prefix: Rspamd 4.0.1 does not include language model
    # paths or multi_model in its provider digest, so reusing NEURAL could
    # accidentally select an incompatible single-language ANN from Redis.
    NEURAL_FASTTEXT {
        symbol_spam = "NEURAL_FASTTEXT_SPAM";
        symbol_ham = "NEURAL_FASTTEXT_HAM";

        train {
            max_iterations = 25;
            learning_rate = 0.01;
            learn_mode = "balanced";
            autotrain = true;
        }

        watch_interval = 30.0;
        timeout = 20;
        spam_score_threshold = 0;
        ham_score_threshold = 0;
        layers = [ 0.5, 0.25 ];

        # Content-only input: no Rspamd symbols and no metatokens.
        disable_symbols_input = true;
        providers = [
            {
                type = "fasttext_embed";
                language_models = {
                    en = "/usr/share/rspamd/fasttext/cc.en.32.direct300.dsub2.ftz";
                    fr = "/usr/share/rspamd/fasttext/cc.fr.32.direct300.dsub2.ftz";
                };
                multi_model = true;
                pooling = "mean_max";
            }
        ];

        fusion {
            include_meta = false;
            normalization = "zscore";
        }
    }
}
